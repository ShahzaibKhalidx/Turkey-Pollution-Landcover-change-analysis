<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Turkey Pollution &amp; Land Cover — WebGIS</title>

    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/custom-styles-final.css">
    <script type="module" src="../assets/js/map-turkey.js"></script>
</head>

<body>
    <div class="map-app">

        <!-- Go Home -->
        <a href="../index.html" id="go-home" class="go-home-btn">Go Home</a>

        <!-- Pollutant switcher -->
        <div class="pollutant-switcher" role="group" aria-label="Pollutant">
            <button class="pollutant-btn" data-pollutant="no2">NO₂</button>
            <button class="pollutant-btn" data-pollutant="pm25">PM₂.₅</button>
            <button class="pollutant-btn active" data-pollutant="pm10">PM10</button>
        </div>

        <!-- Layer panel (collapsible sidebar) -->
        <aside id="layer-panel" class="layer-panel">
            <div class="layer-panel-header">
                <h2>Layers</h2>
                <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Collapse panel">‹</button>
            </div>

            <div class="layer-panel-body">
                <label class="layer-toggle-row">
                    <input type="checkbox" class="layer-toggle" data-layer="concentration" checked>
                    <span>Concentration map 2023</span>
                </label>
                <label class="layer-toggle-row">
                    <input type="checkbox" class="layer-toggle" data-layer="amac">
                    <span>AMAC change 2021–2023</span>
                </label>
                <label class="layer-toggle-row">
                    <input type="checkbox" class="layer-toggle" data-layer="landCover">
                    <span>Land Cover Change</span>
                </label>
                <label class="layer-toggle-row">
                    <input type="checkbox" class="layer-toggle" data-layer="bivariate">
                    <span>Bivariate (population × pollution)</span>
                </label>
                <label class="layer-toggle-row">
                    <input type="checkbox" class="layer-toggle" data-layer="population">
                    <span>Population quantiles</span>
                </label>
                <label class="layer-toggle-row">
                    <input type="checkbox" class="layer-toggle" data-layer="zonalStatistics">
                    <span>Zonal statistics</span>
                </label>
                <label class="layer-toggle-row">
                    <input type="checkbox" class="layer-toggle" data-layer="average2023">
                    <span>Average 2023</span>
                </label>
                <label class="layer-toggle-row">
                    <input type="checkbox" class="layer-toggle" data-layer="cams2023">
                    <span>CAMS Dec 2023</span>
                </label>

                <hr class="panel-divider">

                <p class="panel-section-title">Basemap</p>
                <div class="basemap-switcher" role="group" aria-label="Basemap">
                    <button class="basemap-btn active" data-basemap="osm">OSM</button>
                    <button class="basemap-btn" data-basemap="esriTopo">ESRI Topo</button>
                    <button class="basemap-btn" data-basemap="esriImagery">ESRI Imagery</button>
                    <button class="basemap-btn" data-basemap="stamenToner">Stamen Toner</button>
                </div>

                <hr class="panel-divider">

                <p class="panel-section-title">WMS Opacity</p>
                <div class="opacity-control">
                    <input type="range" id="opacity-slider" min="0" max="1" step="0.05" value="0.85">
                    <span id="opacity-value">85%</span>
                </div>
            </div>
        </aside>

        <!-- Map -->
        <div id="map"></div>

        <!-- Legend -->
        <div id="legend" class="legend-container">
            <span class="legend-title">Legend</span>
            <div id="legend-content" class="legend-content"></div>
        </div>

    </div>
</body>

</html>
